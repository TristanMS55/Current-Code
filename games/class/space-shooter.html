<html>
    <head>
        <title>Game Loop</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

        <style>
            /* Remove margins and never show scrollbars */
            *{
                margin:0;
                overflow: hidden;
            }
        </style>
    </head>

    <body>
        <canvas id="canv">

        </canvas>

        <!-- <p>Engine</p> -->
        <script src="../../engine/Vector2.js"></script>
        <script src="../../engine/Input.js"></script>
        <script src="../../engine/Engine.js"></script>
        <script src="../../engine/Component.js"></script>
        <script src="../../engine/GameObject.js"></script>
        <script src="../../engine/Scene.js"></script>
        <script src="../../engine/Time.js"></script>
        <script src="../../engine/SceneManager.js"></script>
        <script src="../../engine/Collisions.js"></script>

        <!-- <p>Engine Components</p> -->
        <script src="../../engine/components/Transform.js"></script>
        <script src="../../engine/components/Polygon.js"></script>
        <script src="../../engine/components/TextLabel.js"></script>
        <script src="../../engine/components/MultiLineTextLabel.js"></script>
        <script src="../../engine/components/Camera.js"></script>
        
        <!-- <p>Game Components</p> -->
        <script src="./components/EnemyController.js"></script>
        <script src="./components/Health.js"></script>
        <script src="./components/LaserController.js"></script>
        <script src="./components/LevelController.js"></script>
        <script src="./components/PointsController.js"></script>
        <script src="./components/UpdateComponent.js"></script>
        <script src="./components/SceneTimerController.js"></script>

        <!-- <p>Game Objects</p> -->
        <script src="./gameObjects/EnemyGameObject.js"></script>
        <script src="./gameObjects/LaserGameObject.js"></script>
        <script src="./gameObjects/LevelControllerGameObject.js"></script>
        <script src="./gameObjects/MainGameObject.js"></script>
        <script src="./gameObjects/PointsGameObject.js"></script>
        <script src="./gameObjects/HelperGameObject.js"></script>

        <!-- <p>Scenes</p> -->
        <script src="./scenes/Level01.js"></script>
        <script src="./scenes/Level02.js"></script>
        <script src="./scenes/GenericLevel.js"></script>
        

        <!-- <p>General Use</p> -->
        <script src="./Assets.js"></script>
        <script src="./Globals.js"></script>
        <script src="./Settings.js"></script>
        

        <script>
            
            //Start the game engine
            Engine.start(Level01, Settings)

            //Tests
            let gameObject = new GameObject()
            gameObject.addComponent(new Polygon(), {points: [
                new Vector2(0,-1), 
                new Vector2(-1, 1), 
                new Vector2(1,1), 
            ]})
            console.assert(Collisions.isCollisionPointPolygon(new Vector2(0,0), gameObject))
            console.assert(!Collisions.isCollisionPointPolygon(new Vector2(10000,10000), gameObject))
            console.assert(!Collisions.isCollisionPointPolygon(new Vector2(0,1.1), gameObject))
            console.assert(!Collisions.isCollisionPointPolygon(new Vector2(0,-1.00001), gameObject))

        </script>
    </body>
</html>
